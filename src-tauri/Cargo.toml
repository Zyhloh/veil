[package]
name = "veil"
version = "2.2.2"
description = "The Next Generation Steam Manifest Installer"
authors = ["Zyhloh"]
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "veil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
zip = "8"
winreg = "0.56"
dirs = "6"
sysinfo = "0.39"
png = "0.18"
sha2 = "0.11"
regex = "1"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
md-5 = "0.11"
flate2 = "1"
